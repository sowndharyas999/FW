<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Premium Footwear</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>NEXUS</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#shop">Shop</a></li>
                <li><a href="#collections">Collections</a></li>
                <li class="cart-icon-container">
                    <a href="#" id="cart-toggle">
                        <svg class="cart-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 2L6 9H3L5 21H19L21 9H18L15 2H9Z"/>
                            <path d="M9 9H15"/>
                        </svg>
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1 class="hero-title">FUTURE OF <span class="gradient-text">FOOTWEAR</span></h1>
                    <p class="hero-subtitle">Experience the perfect fusion of innovation and style with our premium collection</p>
                    <button class="cta-button" onclick="scrollToShop()">
                        <span>Shop Now</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
                <div class="hero-image">
                    <div class="floating-shoe">
                        <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600&h=400&fit=crop" alt="Premium Shoe" />
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Product Grid -->
    <section id="shop" class="products">
        <div class="container">
            <h2 class="section-title">Featured Collection</h2>
            <div class="product-grid" id="product-grid">
                <!-- Products will be dynamically loaded here -->
            </div>
        </div>
    </section>

    <!-- Shopping Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart" onclick="toggleCart()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items will be dynamically loaded here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total">$0</span>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Secure Checkout</h3>
                <button class="close-modal" onclick="closeCheckout()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="checkout-steps">
                <div class="step active" id="step-1">
                    <h4>Shipping Information</h4>
                    <form id="shipping-form">
                        <input type="text" placeholder="Full Name" required>
                        <input type="email" placeholder="Email Address" required>
                        <input type="tel" placeholder="Phone Number" required>
                        <input type="text" placeholder="Shipping Address" required>
                        <input type="text" placeholder="City" required>
                        <input type="text" placeholder="ZIP Code" required>
                        <button type="button" onclick="nextStep(2)">Continue to Payment</button>
                    </form>
                </div>
                <div class="step" id="step-2">
                    <h4>Payment Details</h4>
                    <form id="payment-form">
                        <div class="card-input">
                            <input type="text" placeholder="Card Number" maxlength="19" required>
                        </div>
                        <div class="card-row">
                            <input type="text" placeholder="MM/YY" maxlength="5" required>
                            <input type="text" placeholder="CVV" maxlength="3" required>
                        </div>
                        <input type="text" placeholder="Cardholder Name" required>
                        <div class="order-summary">
                            <h5>Order Summary</h5>
                            <div id="checkout-items"></div>
                            <div class="total-row">
                                <span>Total:</span>
                                <span id="checkout-total">$0</span>
                            </div>
                        </div>
                        <button type="submit" onclick="processPayment()">Pay Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-content">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 6L9 17l-5-5"/>
            </svg>
            <span id="toast-message">Item added to cart!</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
